<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sargam Jii ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Baloo+2:wght@600&family=Fredoka:wght@600&display=swap" rel="stylesheet">

<!-- Confetti -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body{
  margin:0;
  height:100vh;
  background:radial-gradient(circle at top,#ff758c,#ff7eb3,#ffd1dc);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Fredoka',sans-serif;
  overflow:hidden;
}

.card{
  background:rgba(255,255,255,0.95);
  width:90%;
  max-width:420px;
  padding:30px;
  border-radius:30px;
  text-align:center;
  box-shadow:0 25px 60px rgba(0,0,0,0.25);
}

h1{
  font-family:'Pacifico',cursive;
  color:#ff2e63;
  font-size:34px;
}

p{
  font-size:20px;
  min-height:60px;
}

button{
  border:none;
  padding:14px 30px;
  margin:12px;
  font-size:18px;
  border-radius:40px;
  cursor:pointer;
  font-family:'Baloo 2',cursive;
  transition:0.3s;
}
button:hover{transform:scale(1.08);}

#nextBtn{
  background:linear-gradient(135deg,#ff2e63,#ff6f91);
  color:white;
}

#yesBtn{
  background:linear-gradient(135deg,#00c853,#69f0ae);
  color:white;
}

#noBtn{
  background:linear-gradient(135deg,#ff1744,#ff5252);
  color:white;
  position:relative;
}

.hidden{display:none;}

#result{
  font-size:26px;
  color:#ff2e63;
}

/* ❤️ HEART OVERLAY */
#heartOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.55);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.heart{
  width:200px;
  height:200px;
  background:linear-gradient(135deg,#ff416c,#ff4b2b);
  position:relative;
  transform:rotate(-45deg) scale(0);
  animation:heartOnce 1.2s ease forwards;
}

.heart::before,
.heart::after{
  content:"";
  width:200px;
  height:200px;
  background:inherit;
  border-radius:50%;
  position:absolute;
}

.heart::before{ top:-100px; left:0; }
.heart::after{ left:100px; top:0; }

.heart-text{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotate(45deg);
  color:white;
  font-size:56px;
  font-family:'Pacifico',cursive;
  text-shadow:0 6px 15px rgba(0,0,0,0.4);
}

@keyframes heartOnce{
  0%{transform:rotate(-45deg) scale(0);}
  60%{transform:rotate(-45deg) scale(1.15);}
  100%{transform:rotate(-45deg) scale(1);}
}
</style>
</head>

<body>

<div class="card">
  <h1>Sargam Jii ❤️</h1>
  <p id="story"></p>

  <button id="nextBtn">Next 💌</button>

  <div id="proposal" class="hidden">
    <p>Will you be mine forever? 🥺💍</p>
    <button id="yesBtn">YES 😍</button>
    <button id="noBtn">NO 🙃</button>
  </div>

  <div id="result"></div>
</div>

<!-- HEART -->
<div id="heartOverlay">
  <div class="heart">
    <span class="heart-text">S</span>
  </div>
</div>

<audio id="music" src="https://files.catbox.moe/f8c2jr.m4a"></audio>

<script>
const scenes=[
 "Aaj Teddy Day hai 🧸",
 "Ek chota sa secret batana tha 😳",
 "Tum mili toh life cute ho gayi 🥺",
 "Main thoda pagal hoon…",
 "Par tumhare liye bilkul serious hoon ❤️"
];

let i=0;
const story=document.getElementById("story");
const nextBtn=document.getElementById("nextBtn");
const proposal=document.getElementById("proposal");
const yesBtn=document.getElementById("yesBtn");
const noBtn=document.getElementById("noBtn");
const result=document.getElementById("result");
const music=document.getElementById("music");

function typeText(text){
  let j=0;
  story.innerText="";
  const t=setInterval(()=>{
    story.innerText+=text[j];
    j++;
    if(j>=text.length) clearInterval(t);
  },60);
}

typeText(scenes[i]);

nextBtn.onclick=()=>{
  i++;
  if(i<scenes.length){
    typeText(scenes[i]);
  }else{
    nextBtn.style.display="none";
    proposal.classList.remove("hidden");
  }
};

yesBtn.onclick=()=>{
  music.play().catch(()=>{});

  confetti({
    particleCount:400,
    spread:180,
    origin:{y:0.6}
  });

  result.innerHTML="YAYYYY 😍💖<br>Tumne YES bol diya 🥹";

  proposal.style.display="none";

  setTimeout(()=>{
    document.getElementById("heartOverlay").style.display="flex";
  },2000);
};

noBtn.onmouseover=()=>{
  noBtn.style.top=Math.random()*80+"%";
  noBtn.style.left=Math.random()*80+"%";
};
</script>

</body>
</html>
