<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sargam Jii ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Baloo+2:wght@600&family=Fredoka:wght@600&display=swap" rel="stylesheet">

<!-- Confetti -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body{
  margin:0;
  height:100vh;
  background:radial-gradient(circle at top,#ff758c,#ff7eb3,#ffd1dc);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Fredoka',sans-serif;
  overflow:hidden;
}

.card{
  background:rgba(255,255,255,0.95);
  width:90%;
  max-width:420px;
  padding:30px;
  border-radius:30px;
  text-align:center;
  box-shadow:0 25px 60px rgba(0,0,0,0.25);
  animation:fadeIn 1.2s ease;
}

h1{
  font-family:'Pacifico',cursive;
  color:#ff2e63;
  font-size:34px;
  margin-bottom:10px;
  animation:glow 2s infinite alternate;
}

p{
  font-size:20px;
  min-height:60px;
}

button{
  border:none;
  padding:14px 30px;
  margin:12px;
  font-size:18px;
  border-radius:40px;
  cursor:pointer;
  font-family:'Baloo 2',cursive;
  transition:0.3s;
}

button:hover{transform:scale(1.08);}

#nextBtn{
  background:linear-gradient(135deg,#ff2e63,#ff6f91);
  color:white;
}

#yesBtn{
  background:linear-gradient(135deg,#00c853,#69f0ae);
  color:white;
}

#noBtn{
  background:linear-gradient(135deg,#ff1744,#ff5252);
  color:white;
  position:relative;
}

#result{
  margin-top:20px;
  font-size:26px;
  color:#ff2e63;
  animation:pop 0.8s infinite alternate;
}

.hidden{display:none;}

@keyframes glow{
  from{text-shadow:0 0 10px #ff2e63;}
  to{text-shadow:0 0 25px #ff6f91;}
}

@keyframes pop{
  from{transform:scale(1);}
  to{transform:scale(1.12);}
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(40px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<div class="card">
  <h1>Sargam Jii ❤️</h1>
  <p id="story"></p>

  <button id="nextBtn">Next 💌</button>

  <div id="proposal" class="hidden">
    <p>Will you be mine forever? 🥺💍</p>
    <button id="yesBtn">YES 😍</button>
    <button id="noBtn">NO 🙃</button>
  </div>

  <div id="result"></div>
</div>

<audio id="music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

<script>
const scenes=[
  {wrong:"Aaj Tedy Day hai 😅", right:"Aaj Teddy Day hai 🧸"},
  {wrong:"Ek chota sa jhut… 😬", right:"Ek chota sa secret batana tha 😳"},
  {wrong:"Tum mile toh life funny ho gayi 🤭", right:"Tum mili toh life cute ho gayi 🥺"},
  {wrong:"Main thoda overacting hoon… 😜", right:"Main thoda pagal hoon…"},
  {wrong:"Par tum important ho ❤️", right:"Par tumhare liye bilkul serious hoon ❤️"}
];

let index=0;
const story=document.getElementById("story");
const nextBtn=document.getElementById("nextBtn");
const proposal=document.getElementById("proposal");
const yesBtn=document.getElementById("yesBtn");
const noBtn=document.getElementById("noBtn");
const result=document.getElementById("result");
const music=document.getElementById("music");

function typeText(text, cb){
  let i=0;
  story.innerText="";
  const interval=setInterval(()=>{
    story.innerText+=text[i];
    i++;
    if(i>=text.length){
      clearInterval(interval);
      if(cb) setTimeout(cb,800);
    }
  },60);
}

function eraseText(cb){
  const interval=setInterval(()=>{
    story.innerText=story.innerText.slice(0,-1);
    if(story.innerText.length===0){
      clearInterval(interval);
      if(cb) cb();
    }
  },40);
}

function playScene(){
  typeText(scenes[index].wrong,()=>{
    eraseText(()=>{
      typeText(scenes[index].right);
    });
  });
}

playScene();

nextBtn.onclick=()=>{
  index++;
  if(index<scenes.length){
    playScene();
  }else{
    nextBtn.style.display="none";
    proposal.classList.remove("hidden");
  }
};

yesBtn.onclick=()=>{
  music.currentTime=0;
  music.play().catch(()=>{});

  confetti({
    particleCount:500,
    spread:180,
    startVelocity:45,
    origin:{y:0.6}
  });

  setTimeout(()=>{
    confetti({
      particleCount:300,
      spread:120,
      origin:{y:0.4}
    });
  },400);

  result.innerHTML="🎉 YAYYYY 😍💖<br>Tumne YES bol diya 🥹<br>Ab tum meri ho 💍";
  proposal.style.display="none";
};

noBtn.onmouseover=()=>{
  noBtn.style.position="absolute";
  noBtn.style.top=Math.random()*80+"%";
  noBtn.style.left=Math.random()*80+"%";
};
</script>

</body>
</html>
