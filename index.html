<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sargam Jii ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Baloo+2:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body{
  margin:0;
  height:100vh;
  background:linear-gradient(270deg,#ff9a9e,#fad0c4,#ffd1ff);
  background-size:600% 600%;
  animation:bgMove 10s ease infinite;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Baloo 2',cursive;
}

@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.card{
  background:white;
  width:90%;
  max-width:420px;
  padding:30px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,0.25);
}

h1{
  font-family:'Pacifico',cursive;
  color:#ff2e63;
}

button{
  border:none;
  padding:12px 25px;
  margin:10px;
  font-size:18px;
  border-radius:30px;
  cursor:pointer;
  font-family:'Baloo 2',cursive;
}

#nextBtn{background:#ff2e63;color:white;}
#yesBtn{background:#00c853;color:white;}
#noBtn{background:#ff1744;color:white;position:relative;}

.hidden{display:none}

/* 🧸 TEDDY SCENE */
#teddyScene{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:flex;
  justify-content:center;
  align-items:flex-end;
  z-index:999;
}

.teddy{
  width:260px;
  animation:teddyEnter 1.2s ease forwards;
}

@keyframes teddyEnter{
  from{transform:translateY(300px) scale(0.5)}
  to{transform:translateY(0) scale(1)}
}

/* ❤️ HEART THROW */
.heart{
  position:absolute;
  bottom:180px;
  background:#ff2e63;
  color:white;
  padding:20px 28px;
  border-radius:50%;
  font-family:'Pacifico',cursive;
  font-size:22px;
  animation:heartFly 2.5s ease forwards;
}

@keyframes heartFly{
  0%{transform:translate(0,0) scale(0.3);opacity:0}
  30%{opacity:1}
  100%{transform:translate(0,-350px) scale(1.2)}
}
</style>
</head>

<body>

<div class="card">
  <h1>Sargam Jii ❤️</h1>
  <p id="story"></p>

  <button id="nextBtn">Next 💌</button>

  <div id="proposal" class="hidden">
    <p>Will you be mine forever? 🥺💍</p>
    <button id="yesBtn">YES 😍</button>
    <button id="noBtn">NO 🙃</button>
  </div>
</div>

<!-- 🧸 TEDDY SCENE -->
<div id="teddyScene" class="hidden">
  <img src="https://i.imgur.com/4AiXzf8.png" class="teddy">
</div>

<script>
const storyText=[
 "Aaj Teddy Day hai 🧸",
 "Ek baat dil se bolni thi 😳",
 "Tum mili toh life cute ho gayi 🥺",
 "Ab ek sawal hai ❤️"
];

let i=0;
const story=document.getElementById("story");
const nextBtn=document.getElementById("nextBtn");
const proposal=document.getElementById("proposal");
const yesBtn=document.getElementById("yesBtn");
const noBtn=document.getElementById("noBtn");
const teddyScene=document.getElementById("teddyScene");

const music=new Audio("https://files.catbox.moe/f8c2jr.m4a");

story.innerText=storyText[i];

nextBtn.onclick=()=>{
 i++;
 if(i<storyText.length){
   story.innerText=storyText[i];
 }else{
   nextBtn.style.display="none";
   proposal.classList.remove("hidden");
 }
};

yesBtn.onclick=()=>{
 music.play();

 confetti({particleCount:500,spread:180});

 proposal.style.display="none";
 teddyScene.classList.remove("hidden");

 // ❤️ HEART THROW AFTER TEDDY APPEARS
 setTimeout(()=>{
   const heart=document.createElement("div");
   heart.className="heart";
   heart.innerHTML="Prem ❤️ Sargam Jii";
   teddyScene.appendChild(heart);
 },1200);
};

noBtn.onmouseover=()=>{
 noBtn.style.top=Math.random()*80+"%";
 noBtn.style.left=Math.random()*80+"%";
};
</script>

</body>
</html>
