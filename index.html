<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sargam Jii ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Baloo+2:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body{
  margin:0;
  height:100vh;
  background:linear-gradient(270deg,#ff9a9e,#fad0c4,#ffd1ff);
  background-size:600% 600%;
  animation:bgMove 10s ease infinite;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Baloo 2',cursive;
}

@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.card{
  background:white;
  width:90%;
  max-width:420px;
  padding:30px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,0.25);
  animation:fadeIn 1.5s;
}

h1{
  font-family:'Pacifico',cursive;
  color:#ff2e63;
  animation:glow 2s infinite alternate;
}

p{font-size:18px;min-height:60px;}

button{
  border:none;
  padding:12px 25px;
  margin:10px;
  font-size:18px;
  border-radius:30px;
  cursor:pointer;
  font-family:'Baloo 2',cursive;
}

#nextBtn{background:#ff2e63;color:white;}
#yesBtn{background:#00c853;color:white;}
#noBtn{background:#ff1744;color:white;position:relative;}

#result{
  margin-top:20px;
  font-size:26px;
  color:#ff2e63;
  animation:pop 1s infinite alternate;
}

.hidden{display:none;}

@keyframes glow{
  from{text-shadow:0 0 10px #ff2e63;}
  to{text-shadow:0 0 25px #ff6f91;}
}
@keyframes pop{
  from{transform:scale(1);}
  to{transform:scale(1.1);}
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(30px);}
  to{opacity:1;transform:translateY(0);}
}

/* 🧸 Teddy */
#teddyBox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:999;
}

.teddy{
  width:260px;
  animation:zoomIn 1s ease;
}

.heart{
  margin-top:-40px;
  background:#ff2e63;
  color:white;
  padding:20px 30px;
  border-radius:50%;
  font-family:'Pacifico',cursive;
  font-size:22px;
  animation:floatHeart 2s infinite;
}

@keyframes zoomIn{
  from{transform:scale(0);}
  to{transform:scale(1);}
}
@keyframes floatHeart{
  0%{transform:translateY(0);}
  50%{transform:translateY(-15px);}
  100%{transform:translateY(0);}
}
</style>
</head>

<body>

<div class="card">
  <h1>Sargam Jii ❤️</h1>
  <p id="story"></p>

  <button id="nextBtn">Next 💌</button>

  <div id="proposal" class="hidden">
    <p>Will you be mine forever? 🥺💍</p>
    <button id="yesBtn">YES 😍</button>
    <button id="noBtn">NO 🙃</button>
  </div>

  <div id="result"></div>
</div>

<!-- Teddy -->
<div id="teddyBox" class="hidden">
  <img src="https://i.imgur.com/4AiXzf8.png" class="teddy">
  <div class="heart">Prem ❤️ Sargam Jii</div>
</div>

<script>
const storyLines=[
 "Aaj Teddy Day hai 🧸",
 "Aur ek secret batana tha 😳",
 "Tum mili toh life cute ho gayi 🥺",
 "Main thoda pagal hoon…",
 "Par tumhare liye bilkul serius hoon ❤️"
];

let line=0, char=0, deleting=false;
const story=document.getElementById("story");
const nextBtn=document.getElementById("nextBtn");
const proposal=document.getElementById("proposal");
const yesBtn=document.getElementById("yesBtn");
const noBtn=document.getElementById("noBtn");
const result=document.getElementById("result");

const music=new Audio("https://files.catbox.moe/f8c2jr.m4a");

function typeEffect(){
  let text=storyLines[line];
  if(!deleting){
    story.innerText=text.substring(0,char++);
    if(char>text.length) return;
  }else{
    story.innerText=text.substring(0,char--);
    if(char<0){deleting=false;line++;char=0;}
  }
  setTimeout(typeEffect,80);
}

typeEffect();

nextBtn.onclick=()=>{
  deleting=true;
  if(line>=storyLines.length-1){
    nextBtn.style.display="none";
    proposal.classList.remove("hidden");
  }
};

yesBtn.onclick=()=>{
  music.play().catch(()=>{});

  confetti({particleCount:500,spread:180,startVelocity:45});

  result.innerHTML="🎉 YAYYYY 😍💖<br>Ab tum meri ho 💍";
  proposal.style.display="none";
  document.getElementById("teddyBox").classList.remove("hidden");
};

noBtn.onmouseover=()=>{
  noBtn.style.top=Math.random()*80+"%";
  noBtn.style.left=Math.random()*80+"%";
};
</script>

</body>
</html>
