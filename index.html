<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Sargam ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Baloo+2:wght@600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  background:linear-gradient(135deg,#ff758c,#ff7eb3);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Baloo 2',cursive;
  overflow:hidden;
}

.card{
  background:#fff;
  width:90%;
  max-width:420px;
  padding:30px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,0.3);
}

h1{
  font-family:'Pacifico',cursive;
  color:#ff2e63;
  font-size:34px;
}

#story{
  font-size:20px;
  min-height:70px;
  white-space:pre-wrap;
}

button{
  padding:14px 30px;
  border:none;
  border-radius:35px;
  font-size:18px;
  margin:10px;
  cursor:pointer;
}

#nextBtn{background:#ff2e63;color:white}
#yesBtn{background:#00c853;color:white}
#noBtn{background:#ff1744;color:white;position:relative}

.hidden{display:none}

/* 🎉 RESULT TEXT */
#result{
  margin-top:20px;
  font-family:'Pacifico',cursive;
  color:#ff2e63;
  animation:pop 1s ease infinite alternate;
}

#result .yay{
  font-size:34px;
}

#result .line{
  font-size:22px;
  margin-top:6px;
}

@keyframes pop{
  from{transform:scale(1)}
  to{transform:scale(1.12)}
}

/* ❤️ HEART OVERLAY */
#heartOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.heart{
  width:180px;
  height:180px;
  background:#ff2e63;
  position:relative;
  transform:rotate(-45deg) scale(0);
  animation:heartZoom 1.2s ease forwards;
}

.heart::before,
.heart::after{
  content:"";
  width:180px;
  height:180px;
  background:#ff2e63;
  border-radius:50%;
  position:absolute;
}

.heart::before{top:-90px;left:0}
.heart::after{left:90px;top:0}

.heart span{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  transform:rotate(45deg);
  font-family:'Pacifico',cursive;
  font-size:64px;
  color:white;
}

@keyframes heartZoom{
  0%{transform:rotate(-45deg) scale(0)}
  60%{transform:rotate(-45deg) scale(1.15)}
  100%{transform:rotate(-45deg) scale(1)}
}
</style>
</head>

<body>

<div class="card">
  <h1>Sargam Jii ❤️</h1>
  <div id="story"></div>

  <button id="nextBtn">Next 💌</button>

  <div id="proposal" class="hidden">
    <p>Will you be mine forever? 🥺</p>
    <button id="yesBtn">YES 😍</button>
    <button id="noBtn">NO 🙃</button>
  </div>

  <div id="result" class="hidden">
    <div class="yay">YAYYYY 😍💖</div>
    <div class="line">Tumne YES bol diya 🥹</div>
  </div>
</div>

<div id="heartOverlay">
  <div class="heart"><span>S</span></div>
</div>

<audio id="music" src="https://files.catbox.moe/f8c2jr.m4a"></audio>

<script>
const texts=[
 "Aaj Teddy Day hai 🧸",
 "Mujhe tumse kuch kehna tha 😳",
 "Tum meri life ka sabse cute hissa ho",
 "Main serious hoon… sirf tumhare liye ❤️"
];

let idx=0;
const story=document.getElementById("story");

function typeText(text){
  let i=0;
  story.textContent="";
  const timer=setInterval(()=>{
    story.textContent+=text.charAt(i);
    i++;
    if(i>=text.length) clearInterval(timer);
  },55);
}

typeText(texts[idx]);

nextBtn.onclick=()=>{
  idx++;
  if(idx<texts.length){
    typeText(texts[idx]);
  }else{
    nextBtn.style.display="none";
    proposal.classList.remove("hidden");
  }
};

yesBtn.onclick=()=>{
  music.play();

  proposal.style.display="none";
  result.classList.remove("hidden");

  confetti({particleCount:250,spread:160,origin:{y:0.6}});

  setTimeout(()=>{
    heartOverlay.style.display="flex";
  },3000);
};

noBtn.onmouseover=()=>{
  noBtn.style.left=Math.random()*70+"%";
  noBtn.style.top=Math.random()*70+"%";
};
</script>

</body>
</html>
