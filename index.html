  <audio autoplay loop>
    <source src="music.mp3" type="audio/mpeg">

  <div class="hearts"></div>

  <div class="card">

    <h1>Happy Teddy Day 🧸</h1>
    <h2>Sargam Jii ❤️</h2>
    <p>
      Tum meri zindagi ka sabse pyara teddy ho 💕  
      Jab bhi udaas hota hoon,

      <br><br>
      Aaj Teddy Day par wada hai —  
      hamesha tumhara hi rahunga 💞
    </p>

    <button onclick="showLove()">Tap for a Surprise 💌</button>
    <div id="loveText"></div>
  </div>

<script src="script.js"></script>
